apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-lab-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resilience-lab
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              resilience-lab-access: "true"
      ports:
        - protocol: TCP
          port: 8080
